[package]
name = "viahorizonplus"
version = "0.1.0"
edition = "2021"
authors = ["rraattrruuee", "ViaHorizonPlus Contributors"]
description = "Multi-version client compatibility and legacy emulation for Horizon"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
parking_lot = "0.12"
thiserror = "2.0"
byteorder = "1.5"

[dev-dependencies]
