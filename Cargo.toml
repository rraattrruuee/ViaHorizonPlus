[package]
name = "viahorizonplus"
version = "0.1.0"
edition = "2021"
authors = ["ViaHorizonPlus Contributors", "FlorianMichael & ViaFabricPlus Contributors (Upstream)"]
description = "ViaFabricPlus port for Horizon (Rust Minecraft 26.3 rewrite), licensed under GPL-3.0-or-later"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
parking_lot = "0.12"
thiserror = "2.0"
byteorder = "1.5"

[dev-dependencies]
